<title>Pocket Mortys</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    height: 100%;
    overflow: hidden;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
    background: #0a0a0f;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    position: relative;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(circle at 20% 20%, rgba(120, 80, 255, 0.25), transparent 50%),
      radial-gradient(circle at 80% 80%, rgba(0, 200, 255, 0.20), transparent 50%),
      radial-gradient(circle at 50% 50%, rgba(255, 80, 180, 0.12), transparent 60%);
    z-index: -1;
    animation: float 18s ease-in-out infinite alternate;
  }

  @keyframes float {
    0%   { transform: scale(1) rotate(0deg); }
    100% { transform: scale(1.15) rotate(3deg); }
  }

  .container {
    text-align: center;
    padding: 24px;
    animation: fadeIn 1.1s cubic-bezier(0.19, 1, 0.22, 1);
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .logo {
    width: 96px;
    height: 96px;
    margin: 0 auto 28px;
    border-radius: 26px;
    background: linear-gradient(135deg, #7c5cff 0%, #00c8ff 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    box-shadow:
      0 20px 50px rgba(124, 92, 255, 0.35),
      inset 0 1px 0 rgba(255, 255, 255, 0.25);
    position: relative;
  }

  .logo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .logo::after {
    content: '';
    position: absolute;
    inset: -2px;
    border-radius: 28px;
    background: linear-gradient(135deg, rgba(124,92,255,0.5), rgba(0,200,255,0.4));
    z-index: -1;
    filter: blur(18px);
    opacity: 0.7;
  }

  h1 {
    font-size: clamp(26px, 6vw, 38px);
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 12px;
    background: linear-gradient(180deg, #ffffff 0%, #b8b8d0 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  p.subtitle {
    font-size: 15px;
    color: rgba(255, 255, 255, 0.55);
    margin-bottom: 44px;
    font-weight: 400;
    letter-spacing: 0.01em;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 18px 42px;
    font-size: 17px;
    font-weight: 600;
    font-family: inherit;
    color: #fff;
    background: linear-gradient(135deg, #7c5cff 0%, #4a8cff 100%);
    border: none;
    border-radius: 999px;
    cursor: pointer;
    text-decoration: none;
    letter-spacing: 0.01em;
    box-shadow:
      0 12px 30px rgba(90, 110, 255, 0.45),
      0 4px 12px rgba(0, 0, 0, 0.3),
      inset 0 1px 0 rgba(255, 255, 255, 0.25);
    transition: transform 0.25s cubic-bezier(0.19, 1, 0.22, 1),
                box-shadow 0.25s ease,
                filter 0.25s ease;
    position: relative;
    overflow: hidden;
  }

  .btn::before {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
    transition: left 0.6s ease;
  }

  .btn:hover {
    transform: translateY(-3px) scale(1.03);
    box-shadow:
      0 18px 40px rgba(90, 110, 255, 0.55),
      0 6px 18px rgba(0, 0, 0, 0.35),
      inset 0 1px 0 rgba(255, 255, 255, 0.3);
  }

  .btn:hover::before {
    left: 100%;
  }

  .btn:active {
    transform: translateY(-1px) scale(0.98);
  }

  .btn svg {
    width: 20px;
    height: 20px;
    stroke-width: 2.2;
  }

  footer {
    position: fixed;
    bottom: 24px;
    left: 0; right: 0;
    text-align: center;
    font-size: 12px;
    color: rgba(255, 255, 255, 0.25);
    letter-spacing: 0.05em;
  }
</style>
</head>
